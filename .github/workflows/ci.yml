name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gleam-server:
    name: Gleam server (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.6"
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam test
      - run: gleam check

  rust-client:
    name: Rust client (fmt + clippy + check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game_client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo check --all-targets
