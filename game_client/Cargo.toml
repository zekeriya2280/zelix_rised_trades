[package]
name = "game_client"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19"
tokio = { version = "1.0", features = ["rt-multi-thread", "time", "macros"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2", features = ["json"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
